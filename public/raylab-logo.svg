<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1218" />
      <stop offset="50%" stop-color="#141923" />
      <stop offset="100%" stop-color="#090C10" />
    </linearGradient>

    <!-- Metallic Cyber Gold -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E8C8" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA820A" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Shield Glow Filter -->
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Core Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0E1218" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Circle / Rounded Squircle Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="230" r="180" fill="url(#centerGlow)" />

  <!-- Outer Tech Circuit Track -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="#252D3B" stroke-width="2" stroke-dasharray="12 16" />
  <circle cx="256" cy="230" r="145" fill="none" stroke="#1D2430" stroke-width="1.5" />

  <!-- Orbiting Nodes -->
  <circle cx="256" cy="60" r="5" fill="#D4AF37" />
  <circle cx="426" cy="230" r="5" fill="#06B6D4" />
  <circle cx="86" cy="230" r="5" fill="#10B981" />

  <!-- Central Crest / Security Shield -->
  <g transform="translate(256, 215)">
    <!-- Outer Golden Shield Frame -->
    <path d="M 0 -115 L 85 -65 L 85 45 C 85 98 42 142 0 160 C -42 142 -85 98 -85 45 L -85 -65 Z"
          fill="#111620" stroke="url(#goldGradient)" stroke-width="5" filter="url(#shieldGlow)" />

    <!-- Inner Secondary Shield -->
    <path d="M 0 -95 L 68 -55 L 68 38 C 68 82 34 118 0 134 C -34 118 -68 82 -68 38 L -68 -55 Z"
          fill="#0C0F15" stroke="url(#cyanGrad)" stroke-width="2" stroke-opacity="0.6" />

    <!-- Terminal Command Prompt Motif ">_" in Cyber Gold -->
    <path d="M -38 -25 L -10 -5 L -38 15" fill="none" stroke="url(#goldGradient)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="2" y1="15" x2="38" y2="15" stroke="url(#cyanGrad)" stroke-width="7" stroke-linecap="round" />

    <!-- Lock Keyhole / Security Core -->
    <circle cx="0" cy="-50" r="10" fill="url(#goldGradient)" />
    <polygon points="-6,-50 6,-50 10,-32 -10,-32" fill="url(#goldGradient)" />
  </g>

  <!-- Typography: RayLab -->
  <text x="256" y="425" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="46" letter-spacing="1">
    <tspan fill="#F3F0E8">Ray</tspan><tspan fill="url(#goldGradient)">Lab</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="256" y="458" text-anchor="middle" fill="#8895A7" font-family="'Courier New', Courier, monospace" font-weight="700" font-size="12" letter-spacing="4">
    LEARN • BUILD • SECURE
  </text>
</svg>
